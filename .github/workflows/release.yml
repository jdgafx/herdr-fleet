name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: build · ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Cross toolchain
        if: matrix.cross
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.cross && 'aarch64-linux-gnu-gcc' || '' }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          cd "target/${{ matrix.target }}/release"
          tar czf "herdr-fleet-${{ matrix.target }}.tar.gz" herdr-fleet
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "herdr-fleet-${{ matrix.target }}.tar.gz" > "herdr-fleet-${{ matrix.target }}.tar.gz.sha256"
          else
            shasum -a 256 "herdr-fleet-${{ matrix.target }}.tar.gz" > "herdr-fleet-${{ matrix.target }}.tar.gz.sha256"
          fi
      - name: Debian package
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: scripts/make-deb.sh "${GITHUB_REF_NAME#v}" "target/${{ matrix.target }}/release/herdr-fleet" "target/${{ matrix.target }}/release"
      - name: Upload to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/${{ matrix.target }}/release/herdr-fleet-${{ matrix.target }}.tar.gz
            target/${{ matrix.target }}/release/herdr-fleet-${{ matrix.target }}.tar.gz.sha256
            target/${{ matrix.target }}/release/*.deb
            target/${{ matrix.target }}/release/*.deb.sha256
